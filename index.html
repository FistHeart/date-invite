<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd5f2">
<title>有件小事想问你</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
:root{--pink:#ff72c8;--pink2:#f65ab9;--pink-soft:#ffd5f2;--ink:#111;--muted:#5e5e5e;--card:#fff}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at 15% 10%,rgba(255,114,200,.32),transparent 18rem),
             radial-gradient(circle at 85% 85%,rgba(255,214,102,.28),transparent 20rem),#ececec;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;border:0;cursor:pointer}
.stage{position:relative;display:grid;min-height:100vh;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.petal{position:fixed;color:var(--pink2);font-size:22px;text-shadow:2px 2px 0 #111;animation:float 7s ease-in-out infinite;pointer-events:none;opacity:.9}
.p1{top:12%;left:8%}.p2{right:8%;bottom:16%;animation-delay:-2.5s}.p3{left:14%;bottom:10%;animation-delay:-4.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.card{position:relative;width:min(520px,100%);min-height:420px;padding:clamp(26px,6vw,40px) clamp(20px,5vw,34px);
  text-align:center;border:5px solid var(--ink);border-radius:34px;background:var(--card);
  box-shadow:0 28px 70px rgba(0,0,0,.18),10px 10px 0 rgba(17,17,17,.08);
  display:none;flex-direction:column;justify-content:center;align-items:center;animation:in .42s cubic-bezier(.2,.9,.2,1) both}
.card.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-weight:900;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(28px,8vw,40px)}h2{font-size:clamp(24px,6.5vw,34px)}
.sub{margin:16px auto 0;max-width:400px;color:var(--muted);font-size:15px;font-weight:700;line-height:1.6}
.emoji{font-size:clamp(44px,12vw,64px);line-height:1;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:140px;height:56px;padding:0 26px;
  border:4px solid var(--ink);border-radius:999px;background:var(--pink);font-weight:900;font-size:17px;
  box-shadow:0 7px 0 var(--ink);transition:transform .15s,box-shadow .15s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:#fff}
.actions{position:relative;width:100%;max-width:340px;min-height:120px;margin:30px auto 0}
.yes{position:absolute;left:14px;top:0}
.no{position:absolute;left:186px;top:0;transition:left .25s cubic-bezier(.22,1,.36,1),top .25s cubic-bezier(.22,1,.36,1),transform .25s}
.field{width:100%;text-align:left;margin-top:16px}
.field span{display:block;margin-bottom:8px;font-weight:900;font-size:14px}
input,select{width:100%;height:56px;padding:0 16px;border:4px solid var(--ink);border-radius:14px;background:#fff;
  font:800 16px ui-rounded,"SF Pro Rounded","PingFang SC",sans-serif;box-shadow:4px 4px 0 var(--ink);outline:none}
input:focus,select:focus{border-color:var(--pink2);box-shadow:4px 4px 0 var(--pink2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;margin-top:22px}
.opt{display:grid;place-items:center;gap:8px;min-height:92px;border:4px solid var(--ink);border-radius:18px;background:#fff;
  box-shadow:5px 5px 0 var(--ink);font-weight:900;font-size:14px;transition:transform .15s,background .15s,box-shadow .15s}
.opt b{font-size:28px;font-weight:400}
.opt:active,.opt.sel{transform:translate(-2px,-2px);background:var(--pink-soft);box-shadow:7px 7px 0 var(--pink2);border-color:var(--pink2)}
.summary{width:100%;margin-top:20px;padding:18px;border:4px dashed var(--ink);border-radius:18px;background:#fffdf7;text-align:left;font-weight:800;line-height:2}
.summary i{font-style:normal;color:var(--pink2)}
.tiny{margin-top:18px;font-size:12px;color:#999;font-weight:700}
.music{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;
  border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);font-size:18px;z-index:9}
.music.playing{background:var(--pink)}
.music.nudge{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:12px 18px;border:3px solid var(--ink);
  border-radius:999px;background:var(--pink-soft);font-weight:800;font-size:13px;box-shadow:4px 4px 0 var(--ink);
  z-index:10;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
.toast.on{opacity:1}
.heart{position:fixed;top:-20px;font-size:18px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="petal p1">✿</div><div class="petal p2">❀</div><div class="petal p3">✽</div>
<button class="music" id="music" aria-label="音乐开关">🎵</button>
<div class="toast" id="toast">点一下 🎵 放点声音</div>
<main class="stage">

  <section class="card on" id="s0">
    <div class="emoji">🌷</div>
    <h1>有件小事，<br>想当面问问你。</h1>
    <p class="sub">（先点一下，音乐才会响）</p>
    <div style="margin-top:28px"><button class="btn" id="start">点我 →</button></div>
  </section>

  <section class="card" id="s1">
    <div class="emoji">💌</div>
    <h2>这个周末，<br>愿不愿意跟我出去走走？</h2>
    <p class="sub">不用急着回答，先点你想点的那个。</p>
    <div class="actions">
      <button class="btn yes" id="yes">愿意 ♥</button>
      <button class="btn ghost no" id="no">再想想</button>
    </div>
  </section>

  <section class="card" id="s2">
    <div class="emoji">😳</div>
    <h2>等一下，<br>你真的点了愿意？</h2>
    <p class="sub">我都已经准备好被你点"再想想"了。</p>
    <div style="margin-top:28px"><button class="btn" id="sure">嗯，认真的 →</button></div>
  </section>

  <section class="card" id="s3">
    <div class="emoji">📅</div>
    <h2>那……你什么时候有空？</h2>
    <form id="dateForm">
      <label class="field"><span>选一天</span><input type="date" id="date" required></label>
      <label class="field"><span>几点见</span>
        <select id="time" required>
          <option value="">选个时间…</option>
          <option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option>
          <option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option>
          <option>18:00</option><option>19:00</option><option>20:00</option>
        </select>
      </label>
      <div style="margin-top:26px"><button class="btn" type="submit">下一步 →</button></div>
    </form>
  </section>

  <section class="card" id="s4">
    <div class="emoji">🍽️</div>
    <h2>想怎么过这一天？</h2>
    <div class="grid" id="opts">
      <button class="opt" data-v="咖啡 + 散步"><b>☕</b>咖啡 + 散步</button>
      <button class="opt" data-v="看一场电影"><b>🎬</b>看场电影</button>
      <button class="opt" data-v="好好吃一顿"><b>🍜</b>好好吃一顿</button>
      <button class="opt" data-v="随便走走也行"><b>🚶</b>随便走走</button>
    </div>
    <p class="tiny">选一个，剩下的我来安排。</p>
  </section>

  <section class="card" id="s5">
    <div class="emoji">🎉</div>
    <h2>那就说定了 ♥</h2>
    <div class="summary" id="summary"></div>
    <p class="sub">把这张卡截图发我，剩下的交给我。</p>
  </section>

</main>
<audio id="bgm" loop preload="auto" src="./music.m4a"></audio>
<script>
const $=id=>document.getElementById(id), cards=[...document.querySelectorAll('.card')];
const HER=(new URLSearchParams(location.search).get('to')||'').trim();
let step=0, picked={};

const bgm=$('bgm'), mBtn=$('music');
function toggleMusic(forceOn){
  if(forceOn||bgm.paused){bgm.play().then(()=>mBtn.classList.add('playing')).catch(()=>{});}
  else{bgm.pause();mBtn.classList.remove('playing');}
}
mBtn.onclick=()=>toggleMusic();

// NFC 打开时先试一次自动播放；被系统拦住就提示手动点
function nudge(msg){
  const el=$('toast'); if(msg) el.textContent=msg;
  el.classList.add('on'); mBtn.classList.add('nudge');
  setTimeout(()=>el.classList.remove('on'),4200);
}
bgm.addEventListener('playing',()=>{mBtn.classList.remove('nudge');});
window.addEventListener('load',()=>{
  bgm.volume=0.7;
  bgm.play().then(()=>mBtn.classList.add('playing'))
    .catch(()=>nudge('浏览器不让自动播放，点一下 🎵'));
});

function go(n){cards[step].classList.remove('on');step=n;cards[n].classList.add('on');}

$('start').onclick=()=>{toggleMusic(true);go(1);};
$('sure').onclick=()=>go(3);

const no=$('no');
function dodge(e){
  e.preventDefault();
  const box=no.parentElement.getBoundingClientRect();
  const w=no.offsetWidth,h=no.offsetHeight;
  no.style.left=Math.max(0,Math.random()*(box.width-w))+'px';
  no.style.top=Math.max(0,Math.random()*(box.height-h))+'px';
  no.style.transform=`rotate(${(Math.random()*30-15).toFixed(0)}deg)`;
}
no.addEventListener('mouseenter',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',dodge);
$('yes').onclick=()=>{go(2);hearts(14);};

$('dateForm').onsubmit=e=>{
  e.preventDefault();
  picked.date=$('date').value; picked.time=$('time').value;
  go(4);
};

$('opts').onclick=e=>{
  const b=e.target.closest('.opt'); if(!b)return;
  picked.vibe=b.dataset.v;
  const d=new Date(picked.date+'T00:00:00');
  const wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  $('summary').innerHTML=
    `<div>时间：<i>${d.getMonth()+1} 月 ${d.getDate()} 日（${wk}）${picked.time}</i></div>`+
    `<div>安排：<i>${picked.vibe}</i></div>`+
    (HER?`<div>给：<i>${HER}</i></div>`:'');
  go(5);hearts(26);
};

function hearts(n){
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='heart';s.textContent=['♥','💗','🌸','✨'][i%4];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2.2+Math.random()*2)+'s';
    s.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),5000);
  }
}

const today=new Date();today.setDate(today.getDate()+1);
$('date').value=today.toISOString().slice(0,10);
$('date').min=new Date().toISOString().slice(0,10);
if(HER){document.querySelector('#s1 h2').innerHTML=`${HER}，<br>这个周末愿不愿意跟我出去走走？`;}
</script>
</body>
</html>
